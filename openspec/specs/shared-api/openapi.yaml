      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui, api-tests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegionUpsertRequest" }
      responses:
        "200":
          description: Updated region.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/regions/{regionId}/archive:
    patch:
      tags: [regions]
      operationId: archiveRegion
      summary: Archive a region.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui]
      parameters:
        - name: regionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archived region.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- stores
  /api/stores:
    get:
      tags: [stores]
      operationId: listStores
      summary: Stores in scope (default status ACTIVE), sorted by name.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      x-indooro-findings: [API-12, PERF-05]
      parameters:
        - name: query
          in: query
          description: Matches name, store code, or city (case-insensitive substring).
          schema: { type: string }
        - name: regionId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/RecordStatusQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/AdminPageSize"
      responses:
        "200":
          description: Page of stores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [stores]
      operationId: createStore
      summary: Create a store (admin, or region manager inside the assigned region).
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager
      x-indooro-consumers: [admin-ui, api-tests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/StoreDetailOk" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stores/{storeId}:
    parameters:
      - $ref: "#/components/parameters/StoreIdPath"
    get:
      tags: [stores]
      operationId: getStore
      summary: Store detail in scope.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      responses:
        "200": { $ref: "#/components/responses/StoreDetailOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [stores]
      operationId: updateStore
      summary: Replace store data; non-admins cannot move a store to another region.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/StoreDetailOk" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stores/{storeId}/archive:
    patch:
      tags: [stores]
      operationId: archiveStore
      summary: Archive a store and release its beacon assignments.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      x-indooro-findings: [SEC-14]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200": { $ref: "#/components/responses/StoreDetailOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stores/{storeId}/audit:
    get:
      tags: [stores]
      operationId: getStoreAudit
      summary: Audit history of a store, newest first.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreAuditResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stores/{storeId}/beacons:
    get:
      tags: [stores]
      operationId: getStoreBeacons
      summary: Active beacon assignments of a store.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: Assignments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BeaconAssignmentResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- store layouts
  /api/stores/{storeId}/layout/current:
    get:
      tags: [store-layouts]
      operationId: getStoreCurrentLayout
      summary: Active layout or the default layout (status DEFAULT).
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200": { $ref: "#/components/responses/StoreLayoutOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stores/{storeId}/layout/versions:
    parameters:
      - $ref: "#/components/parameters/StoreIdPath"
    get:
      tags: [store-layouts]
      operationId: listStoreLayoutVersions
      summary: All layout versions, highest version first.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      x-indooro-findings: [API-17]
      responses:
        "200":
          description: Version summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LayoutVersionSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
