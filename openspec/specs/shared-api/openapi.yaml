openapi: 3.1.0
info:
  title: Indooro API
  version: "2026.09.17"
  summary: Shared HTTP contract of the Indooro backend (Quarkus) for the iOS client, the Admin Platform, and the customer web page.
  description: |
    Hand-reviewed contract that mirrors the implementation in
    `backend/indooro_server/src/main/java/at/htl/resource` at commit `63a42d4`.
    It is the single source of truth referenced by the OpenSpec capability `shared-api`.

    Every operation carries:
    - `x-indooro-access`: effective access class today
      (`public`, `authenticated`, `role:admin`, `role:admin|region-manager`, `role:admin|region-manager|store-manager`).
      Region and store scope is enforced additionally by `AdminAccessService` for non-admin roles.
    - `x-indooro-consumers`: known shipped consumers (`ios`, `admin-ui`, `customer-web`, `api-tests`, `none`).
    - `x-indooro-findings` (optional): audit finding ids from `docs/audit/CODE_AUDIT.md`.

    Conventions: camelCase JSON, UUID strings for PostgreSQL ids, integer product ids and category codes,
    ISO-8601 UTC instants (fractional seconds possible), beacon UUIDs as 32 lowercase hex characters.
  contact:
    name: Indooro Team (HTL Leonding)
servers:
  - url: https://it220209.cloud.htl-leonding.ac.at
    description: LeoCloud (namespace student-it220209)
  - url: http://localhost:8080
    description: Local Quarkus dev mode
tags:
  - name: mobile-stores
    description: Anonymous store discovery and store layouts for the iOS client.
  - name: mobile-recipes
    description: Anonymous published recipe catalog.
  - name: mobile-upsell
    description: Anonymous upsell planning, telemetry, and dismissals.
  - name: catalog
    description: Product and category catalog (OpenSearch).
  - name: legacy-layout
    description: Global legacy layout documents (OpenSearch index `layouts`).
  - name: utility
    description: PDF conversion and export utilities.
  - name: maintenance
    description: Catalog index maintenance and health.
  - name: admin-session
    description: Current admin user.
  - name: admin-logs
    description: Audit and error logs.
  - name: admin-products
    description: Admin product catalog maintenance.
  - name: admin-recipes
    description: Admin recipe management and ingredient-product mapping.
  - name: admin-recipe-tags
    description: Admin recipe tag management.
  - name: regions
    description: Region master data.
  - name: stores
    description: Store master data, audit, and beacon assignments.
  - name: store-layouts
    description: Versioned store layouts and editor context.
  - name: beacons
    description: Beacon inventory and assignments.
  - name: example
    description: Quarkus template resource (dead code, DC-16).

security: []

paths:
  /hello:
    get:
      tags: [example]
      operationId: hello
      deprecated: true
      summary: Quarkus template greeting.
      x-indooro-access: public
      x-indooro-consumers: [none]
      x-indooro-findings: [DC-16]
      responses:
        "200":
          description: Greeting text.
          content:
            text/plain:
              schema:
                type: string
                example: Hello from Quarkus REST

  # ---------------------------------------------------------------- mobile
  /api/mobile/stores:
    get:
      tags: [mobile-stores]
      operationId: listMobileStores
      summary: List active stores ordered by name.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      responses:
        "200":
          description: Active stores.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MobileStoreSummary" }
  /api/mobile/stores/beacon-identities:
    get:
      tags: [mobile-stores]
      operationId: listMobileBeaconIdentities
      summary: Distinct normalized UUIDs of active beacons assigned to active stores.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      responses:
        "200":
          description: Beacon UUID catalog for ranging constraints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeaconIdentitiesResponse" }
  /api/mobile/stores/by-beacon:
    get:
      tags: [mobile-stores]
      operationId: findMobileStoreByBeacon
      summary: Resolve the active store for a detected beacon.
      description: |
        With major and minor, the exact identity key is tried first. If no active exact match exists,
        resolution falls back to UUID-only matching (finding BUG-09).
      x-indooro-access: public
      x-indooro-consumers: [ios]
      x-indooro-findings: [BUG-09]
      parameters:
        - name: uuid
          in: query
          required: true
          description: Beacon UUID with or without hyphens, any case.
          schema: { type: string, maxLength: 40 }
        - name: major
          in: query
          description: Must be sent together with minor.
          schema: { type: integer }
        - name: minor
          in: query
          description: Must be sent together with major.
          schema: { type: integer }
      responses:
        "200":
          description: Store and matched beacon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreByBeaconResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/mobile/stores/{storeId}/layout/current:
    get:
      tags: [mobile-stores]
      operationId: getMobileStoreLayout
      summary: Active layout of an active store, or the bundled default layout.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      x-indooro-findings: [API-03, PERF-26, PERF-29]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: Layout with source information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileLayoutResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/mobile/recipes:
    get:
      tags: [mobile-recipes]
      operationId: listMobileRecipes
      summary: Published recipes, newest first.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      x-indooro-findings: [PERF-02]
      parameters:
        - $ref: "#/components/parameters/RecipeTagQuery"
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/MobilePageSize"
      responses:
        "200":
          description: Page of recipe summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeSummaryPage" }
  /api/mobile/recipes/search:
    get:
      tags: [mobile-recipes]
      operationId: searchMobileRecipes
      summary: Search published recipes by title, summary, or description.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      x-indooro-findings: [PERF-02, PERF-31]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - $ref: "#/components/parameters/RecipeTagQuery"
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/MobilePageSize"
      responses:
        "200":
          description: Page of recipe summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/mobile/recipes/{recipeId}:
    get:
      tags: [mobile-recipes]
      operationId: getMobileRecipe
      summary: Published recipe detail.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      parameters:
        - $ref: "#/components/parameters/RecipeIdPath"
      responses:
        "200":
          description: Recipe detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/mobile/recipes/{recipeId}/product-mapping:
    get:
      tags: [mobile-recipes]
      operationId: getMobileRecipeProductMapping
      summary: Ingredient-to-product mapping status of a published recipe for a store.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      parameters:
        - $ref: "#/components/parameters/RecipeIdPath"
        - $ref: "#/components/parameters/StoreIdQuery"
        - $ref: "#/components/parameters/StoreCodeQuery"
      responses:
        "200":
          description: Mapping status per ingredient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeProductMappingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/mobile/upsell/suggestions:
    post:
      tags: [mobile-upsell]
      operationId: postUpsellSuggestions
      deprecated: true
      summary: Single-product upsell suggestions (no shipped client).
      x-indooro-access: public
      x-indooro-consumers: [none]
      x-indooro-findings: [DC-23, PERF-01, SEC-12]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsellSuggestionRequest" }
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpsellSuggestionResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/mobile/upsell/plan:
    post:
      tags: [mobile-upsell]
      operationId: postUpsellPlan
      summary: Upsell suggestions for several shopping stations at once.
      x-indooro-access: public
      x-indooro-consumers: [ios, api-tests]
      x-indooro-findings: [PERF-01, PERF-03, PERF-04, SEC-12, SEC-21]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsellPlanRequest" }
      responses:
        "200":
          description: Plan with suggestions per opportunity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpsellPlanResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /api/mobile/upsell/events:
    post:
      tags: [mobile-upsell]
      operationId: postUpsellEvent
      summary: Store an upsell telemetry event.
      x-indooro-access: public
      x-indooro-consumers: [ios, api-tests]
      x-indooro-findings: [SEC-13]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsellEventRequest" }
      responses:
        "202": { description: Event stored. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /api/mobile/upsell/dismiss:
    post:
      tags: [mobile-upsell]
      operationId: postUpsellDismiss
      summary: Record that a suggestion was dismissed.
      description: The stored suppression is currently never read (finding BUG-01).
      x-indooro-access: public
      x-indooro-consumers: [ios, api-tests]
      x-indooro-findings: [API-01, BUG-01, BUG-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsellDismissRequest" }
      responses:
        "202": { description: Dismissal stored. }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- catalog
  /api/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List product documents (match_all).
      x-indooro-access: public
      x-indooro-consumers: [ios, customer-web]
      x-indooro-findings: [API-14, PERF-25]
      parameters:
        - name: size
          in: query
          description: No upper bound is enforced on this legacy route.
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Products. The array may contain null entries (finding API-14).
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Product"
                    - type: "null"
        "500": { $ref: "#/components/responses/LegacyServerError" }
    post:
      tags: [catalog]
      operationId: indexProduct
      summary: Index one product (legacy write path).
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [api-tests]
      x-indooro-findings: [API-20, BUG-12]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Product" }
      responses:
        "200":
          description: OpenSearch result as string.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, examples: [Created, Updated] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
  /api/products/search:
    get:
      tags: [catalog]
      operationId: searchProducts
      summary: Fuzzy product search with optional store filter.
      x-indooro-access: public
      x-indooro-consumers: [ios, customer-web, admin-ui]
      x-indooro-findings: [API-04, API-13, SEC-22]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - $ref: "#/components/parameters/StoreIdTextQuery"
        - $ref: "#/components/parameters/StoreCodeQuery"
      responses:
        "200":
          description: Matching products.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
  /api/products/{id}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Product by id.
      x-indooro-access: public
      x-indooro-consumers: [api-tests]
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
      responses:
        "200":
          description: Product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
  /api/products/bulk:
    post:
      tags: [catalog]
      operationId: indexProductsBulk
      summary: Bulk index products (used by the admin import drawer).
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui, api-tests]
      x-indooro-findings: [API-20]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/Product" }
      responses:
        "200":
          description: Summary message. Per-item OpenSearch errors are only logged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List categories sorted by code; seeds the index on first read.
      x-indooro-access: public
      x-indooro-consumers: [admin-ui, api-tests]
      x-indooro-findings: [API-15, PERF-08]
      parameters:
        - name: size
          in: query
          description: Clamped to 1..500; values below 1 become 100.
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
    post:
      tags: [catalog]
      operationId: upsertCategory
      summary: Create or replace one category.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Category" }
      responses:
        "200":
          description: Stored category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/categories/{categoryCode}:
    parameters:
      - name: categoryCode
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [catalog]
      operationId: getCategory
      summary: Category by code.
      x-indooro-access: public
      x-indooro-consumers: [api-tests]
      responses:
        "200":
          description: Category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }
    put:
      tags: [catalog]
      operationId: replaceCategory
      summary: Create or replace a category under the path code.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [none]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Category" }
      responses:
        "200":
          description: Stored category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/categories/bulk:
    post:
      tags: [catalog]
      operationId: indexCategoriesBulk
      summary: Bulk index categories.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/Category" }
      responses:
        "200":
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                required: [message, count]
                properties:
                  message: { type: string, const: Categories indexed }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- legacy layout
  /api/layout/current:
    get:
      tags: [legacy-layout]
      operationId: getLegacyCurrentLayout
      summary: Current global layout or the bundled default layout.
      x-indooro-access: public
      x-indooro-consumers: [ios, customer-web, admin-ui]
      x-indooro-findings: [PERF-08]
      responses:
        "200":
          description: Layout document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyLayoutDocument" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
    post:
      tags: [legacy-layout]
      operationId: saveLegacyCurrentLayout
      summary: Save a new global layout version and make it current.
      description: Currently anonymous (finding SEC-06); scheduled to require role admin by change `protect-legacy-write-endpoints`.
      x-indooro-access: public
      x-indooro-consumers: [admin-ui]
      x-indooro-findings: [SEC-02, SEC-06, PERF-33, BUG-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyLayoutDocument" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [message, layoutId, savedAt]
                properties:
                  message: { type: string }
                  layoutId: { type: string, format: uuid }
                  savedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
  /api/layout/history:
    get:
      tags: [legacy-layout]
      operationId: listLegacyLayoutHistory
      summary: Recent global layout versions.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      x-indooro-findings: [API-08, PERF-09]
      parameters:
        - name: limit
          in: query
          description: Values below 1 become 10; no upper bound is enforced.
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Versions ordered by savedAt descending.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LayoutHistoryEntry" }
        "500": { $ref: "#/components/responses/LegacyServerError" }
  /api/layout/versions/{layoutId}:
    get:
      tags: [legacy-layout]
      operationId: getLegacyLayoutVersion
      summary: One global layout version by id.
      x-indooro-access: public
      x-indooro-consumers: [ios]
      parameters:
        - name: layoutId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Layout document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyLayoutDocument" }
        "404": { $ref: "#/components/responses/LegacyNotFound" }

  # ---------------------------------------------------------------- utility
  /api/convert/pdf-to-json:
    post:
      tags: [utility]
      operationId: convertPdfToJson
      summary: Parse a belegplan PDF into product rows without persisting them.
      x-indooro-access: public
      x-indooro-consumers: [none]
      x-indooro-findings: [SEC-06, SEC-11]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/pdf
      responses:
        "200":
          description: Parsed rows, deduplicated by layout code.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportedProduct" }
        "400":
          description: No file uploaded.
          content:
            application/json:
              schema: { type: string, const: Keine Datei hochgeladen }
        "500":
          description: Parsing failed (plain German message).
          content:
            application/json:
              schema: { type: string }
  /api/export/pdf:
    post:
      tags: [utility]
      operationId: exportBelegplanPdf
      summary: Render a belegplan PDF from product rows.
      x-indooro-access: public
      x-indooro-consumers: [none]
      x-indooro-findings: [SEC-05, SEC-06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Product" }
      responses:
        "200":
          description: PDF attachment `belegplan_export.pdf`.
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        "500":
          description: Export failed (plain German message).
          content:
            application/pdf:
              schema: { type: string }

  # ---------------------------------------------------------------- maintenance
  /api/admin/index/create:
    post:
      tags: [maintenance]
      operationId: createProductIndex
      summary: Create the product index with its mapping.
      description: Reports success even when creation fails (finding BUG-11).
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: authenticated
      x-indooro-consumers: [api-tests]
      x-indooro-findings: [SEC-06, BUG-11, BUG-12]
      responses:
        "200":
          description: Message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/admin/index:
    delete:
      tags: [maintenance]
      operationId: deleteProductIndex
      summary: Delete the product index (destructive).
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: authenticated
      x-indooro-consumers: [api-tests]
      x-indooro-findings: [SEC-06, BUG-11]
      responses:
        "200":
