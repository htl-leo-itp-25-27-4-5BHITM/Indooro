        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- beacons
  /api/beacons:
    get:
      tags: [beacons]
      operationId: listBeacons
      summary: Beacons visible in scope, sorted by beacon code.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      x-indooro-findings: [PERF-06]
      parameters:
        - $ref: "#/components/parameters/RecordStatusQuery"
        - name: assigned
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/StoreIdQuery"
        - name: query
          in: query
          description: Matches beacon code or identity key (case-insensitive substring).
          schema: { type: string }
      responses:
        "200":
          description: Beacons.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BeaconResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [beacons]
      operationId: createBeacon
      summary: Create a beacon.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui, api-tests]
      x-indooro-findings: [BUG-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeaconCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/BeaconOk" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/beacons/free:
    get:
      tags: [beacons]
      operationId: listFreeBeacons
      summary: Active beacons without an active assignment.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [api-tests]
      x-indooro-findings: [DC-11]
      responses:
        "200":
          description: Free beacons.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BeaconResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/beacons/bulk:
    post:
      tags: [beacons]
      operationId: bulkCreateBeacons
      summary: Create several beacons with a shared UUID and major.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin
      x-indooro-consumers: [admin-ui]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeaconBulkCreateRequest" }
      responses:
        "200":
          description: Created beacons.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeaconBulkCreateResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/beacons/{beaconId}:
    parameters:
      - $ref: "#/components/parameters/BeaconIdPath"
    get:
      tags: [beacons]
      operationId: getBeacon
      summary: Beacon in scope.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [api-tests]
      responses:
        "200": { $ref: "#/components/responses/BeaconOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [beacons]
      operationId: updateBeacon
      summary: Replace beacon code, identity, and notes.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      x-indooro-findings: [SEC-14, BUG-08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeaconCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/BeaconOk" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/beacons/{beaconId}/archive:
    patch:
      tags: [beacons]
      operationId: archiveBeacon
      summary: Archive a beacon and release its assignment.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      parameters:
        - $ref: "#/components/parameters/BeaconIdPath"
      responses:
        "200": { $ref: "#/components/responses/BeaconOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/beacons/{beaconId}/assign:
    post:
      tags: [beacons]
      operationId: assignBeacon
      summary: Assign an active beacon to an active store in scope.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      parameters:
        - $ref: "#/components/parameters/BeaconIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeaconAssignmentRequest" }
      responses:
        "200":
          description: Active assignment (existing one when already assigned to the store).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeaconAssignmentResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/beacons/{beaconId}/release:
    post:
      tags: [beacons]
      operationId: releaseBeacon
      summary: End the active assignment.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui, api-tests]
      parameters:
        - $ref: "#/components/parameters/BeaconIdPath"
      responses:
        "200":
          description: Release result.
          content:
            application/json:
              schema:
                type: object
                required: [beaconId, released]
                properties:
                  beaconId: { type: string, format: uuid }
                  released: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    oidcSession:
      type: apiKey
      in: cookie
      name: q_session
      description: Quarkus OIDC web-app session cookie (split tokens) created by the Keycloak authorization code flow.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token of realm `indooro` with realm roles in `realm_access.roles`.

  parameters:
    StoreIdPath:
      name: storeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeIdPath:
      name: recipeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IngredientIdPath:
      name: ingredientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagIdPath:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LayoutIdPath:
      name: layoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BeaconIdPath:
      name: beaconId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    StoreIdQuery:
      name: storeId
      in: query
      schema: { type: string, format: uuid }
    StoreIdTextQuery:
      name: storeId
      in: query
      description: Free-text store id matched against the product `storeId` keyword.
      schema: { type: string }
    StoreCodeQuery:
      name: storeCode
      in: query
      schema: { type: string, maxLength: 50 }
    RecipeTagQuery:
      name: tag
      in: query
      description: Recipe tag code (case-insensitive).
      schema: { type: string }
    RecordStatusQuery:
      name: status
      in: query
      description: Defaults to ACTIVE; invalid values return 400.
      schema: { $ref: "#/components/schemas/RecordStatus" }
    Page:
      name: page
      in: query
      description: Zero-based; negative values become 0.
      schema: { type: integer, default: 0, minimum: 0 }
    AdminPageSize:
      name: size
      in: query
      description: Clamped to 1..100.
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    MobilePageSize:
      name: size
      in: query
      description: Clamped to 1..50.
      schema: { type: integer, default: 20, minimum: 1, maximum: 50 }

  responses:
    BadRequest:
      description: Request rejected by service validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ValidationFailed:
      description: Bean Validation or service validation failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - $ref: "#/components/schemas/ViolationReport"
    Unauthorized:
      description: Not authenticated. Browser requests to `/admin/**` are redirected to Keycloak instead.
    Forbidden:
      description: Role or scope does not allow the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    NotFound:
      description: Entity not found or not visible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Conflict:
      description: Uniqueness or state conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ServiceUnavailable:
      description: Product catalog not reachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    LegacyBadRequest:
      description: Legacy error body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyError" }
    LegacyNotFound:
      description: Legacy error body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyError" }
    LegacyServerError:
      description: Legacy error body built by string concatenation (may be invalid JSON, finding BUG-12).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyError" }
    RecipeDetailOk:
      description: Recipe detail.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecipeDetail" }
    StoreDetailOk:
      description: Store detail.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StoreDetailResponse" }
    StoreLayoutOk:
      description: Store layout.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StoreLayoutResponse" }
    BeaconOk:
      description: Beacon.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BeaconResponse" }

  schemas:
    # ---------- shared
    ApiErrorResponse:
      type: object
      required: [status, error, method, path, timestamp]
      properties:
        status: { type: integer, examples: [404] }
        error: { type: string, examples: [Filiale nicht gefunden.] }
        method: { type: string, examples: [GET] }
        path: { type: string, examples: [/api/stores/00000000-0000-0000-0000-000000000000] }
        timestamp: { type: string, format: date-time }
    ViolationReport:
      type: object
      description: Quarkus Hibernate Validator violation report.
      properties:
        title: { type: string }
        status: { type: integer, const: 400 }
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    LegacyError:
      type: object
      properties:
        error: { type: string }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    RecordStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    RecipeStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    # ---------- catalog
    Product:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: [number, "null"], minimum: 0 }
        layoutCode:
          type: [string, "null"]
          description: Store format `<categoryCode>/<meter>/<level>/<position>`, e.g. `310/1/1/1`.
        storeId: { type: [string, "null"] }
        storeCode: { type: [string, "null"] }
    Category:
      type: object
      required: [categoryCode, categoryName]
      properties:
        categoryCode: { type: integer }
        categoryName: { type: string }
    ImportedProduct:
      type: object
      properties:
        id: { type: [integer, "null"] }
        name: { type: string }
        layoutCode: { type: string }

    # ---------- layouts
    LayoutElement:
      type: object
      additionalProperties: true
      description: Editor element. Unknown keys are preserved.
      properties:
        id: { type: [string, integer] }
        type: { type: string, examples: [shelf, wall, aisle, cashier, entrance, poi, beacon] }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        rotation: { type: number }
        accessAngle: { type: number }
        locked: { type: boolean }
        label: { type: string, description: Untrusted text; clients must escape it (finding SEC-02). }
        category: { type: [string, integer] }
        meter: { type: [string, integer] }
        color: { type: string }
        beaconId: { type: string, description: Untrusted text; clients must escape it. }
        beaconCode: { type: string }
        identityKey: { type: string }
        uuid: { type: string }
        major: { type: integer }
        minor: { type: integer }
    LayoutDocument:
      type: object
      additionalProperties: true
      properties:
        shopName: { type: string }
        exportDate: { type: string }
        gridSize:
          type: object
          properties:
            width: { type: number }
            height: { type: number }
        elements:
          type: array
          items: { $ref: "#/components/schemas/LayoutElement" }
    LegacyLayoutDocument:
      allOf:
        - $ref: "#/components/schemas/LayoutDocument"
        - type: object
          properties:
            layoutId: { type: string, description: UUID or `bundled-default`. }
            savedAt: { type: string, format: date-time }
            recordType: { type: string, enum: [current, version, bundled] }
    LayoutHistoryEntry:
      type: object
      properties:
        layoutId: { type: string }
        shopName: { type: string }
        savedAt: { type: string }
        exportDate: { type: string }
        elementCount: { type: integer }

    # ---------- mobile
    MobileStoreSummary:
      type: object
      required: [id, storeCode, name]
      properties:
        id: { type: string, format: uuid }
        storeCode: { type: string }
        name: { type: string }
        city: { type: string }
        address: { type: string, description: "`<street>, <zipCode> <city>`" }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    BeaconIdentitiesResponse:
      type: object
      required: [uuids]
      properties:
        uuids:
          type: array
          items: { type: string, pattern: "^[0-9a-f]{32}$" }
    MatchedBeaconSummary:
      type: object
      properties:
        beaconId: { type: string, format: uuid }
        beaconCode: { type: string }
        identityKey: { type: string }
    StoreByBeaconResponse:
      type: object
      required: [store, matchedBeacon]
      properties:
        store: { $ref: "#/components/schemas/MobileStoreSummary" }
        matchedBeacon: { $ref: "#/components/schemas/MatchedBeaconSummary" }
    MobileLayoutResponse:
      type: object
      required: [storeId, source, fallback, layout]
      properties:
        storeId: { type: string, format: uuid }
        layoutId: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [ACTIVE, DEFAULT] }
        fallback: { type: boolean }
        layout: { $ref: "#/components/schemas/LayoutDocument" }

    # ---------- recipes
    RecipeTag:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RecordStatus" }
    RecipeStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        instruction: { type: string }
        durationMinutes: { type: [integer, "null"], minimum: 0 }
    RecipeIngredient:
      type: object
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        displayName: { type: string }
        canonicalName: { type: [string, "null"] }
        quantity: { type: [number, "null"] }
        quantityText: { type: [string, "null"] }
        unitCode: { type: [string, "null"] }
        unitDisplayName: { type: [string, "null"] }
        preparationNote: { type: [string, "null"] }
        optional: { type: boolean }
    RecipeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        servings: { type: integer }
        prepTimeMinutes: { type: [integer, "null"] }
        cookTimeMinutes: { type: [integer, "null"] }
        totalTimeMinutes: { type: [integer, "null"] }
        status: { $ref: "#/components/schemas/RecipeStatus" }
        publishedAt: { type: [string, "null"], format: date-time }
        mappedIngredientCount: { type: integer }
        totalIngredientCount: { type: integer }
        tags:
          type: array
          items: { $ref: "#/components/schemas/RecipeTag" }
    RecipeDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, "null"] }
        description: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        imageAlt: { type: [string, "null"] }
        servings: { type: integer }
        prepTimeMinutes: { type: [integer, "null"] }
        cookTimeMinutes: { type: [integer, "null"] }
        totalTimeMinutes: { type: [integer, "null"] }
        status: { $ref: "#/components/schemas/RecipeStatus" }
        publishedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: "#/components/schemas/RecipeTag" }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/RecipeIngredient" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RecipeStep" }
    RecipeSummaryPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/RecipeSummary" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
    RecipeUpsertRequest:
      type: object
      required: [slug, title, servings]
      properties:
        slug: { type: string, maxLength: 140, description: "Normalized to `[a-z0-9-]`." }
        title: { type: string, maxLength: 180 }
        summary: { type: [string, "null"], maxLength: 4000 }
        description: { type: [string, "null"], maxLength: 12000 }
        imageUrl: { type: [string, "null"] }
        imageAlt: { type: [string, "null"], maxLength: 240 }
        servings: { type: integer, minimum: 1 }
        prepTimeMinutes: { type: [integer, "null"], minimum: 0 }
        cookTimeMinutes: { type: [integer, "null"], minimum: 0 }
        totalTimeMinutes: { type: [integer, "null"], minimum: 0 }
        status: { oneOf: [{ $ref: "#/components/schemas/RecipeStatus" }, { type: "null" }] }
        tagIds:
          type: [array, "null"]
          items: { type: string, format: uuid }
    RecipeIngredientRequest:
      type: object
      required: [position, displayName]
      properties:
        position: { type: integer, minimum: 1 }
        displayName: { type: string, maxLength: 180 }
        canonicalName: { type: [string, "null"], maxLength: 180 }
        quantity: { type: [number, "null"], minimum: 0 }
        quantityText: { type: [string, "null"], maxLength: 80 }
        unitCode: { type: [string, "null"], maxLength: 20 }
        preparationNote: { type: [string, "null"], maxLength: 2000 }
        optional: { type: [boolean, "null"] }
    RecipeStepRequest:
      type: object
      required: [position, instruction]
      properties:
        position: { type: integer, minimum: 1 }
        instruction: { type: string, maxLength: 12000 }
        durationMinutes: { type: [integer, "null"], minimum: 0 }
    RecipeTagRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 120 }
        kind: { type: [string, "null"], maxLength: 40 }
        status: { oneOf: [{ $ref: "#/components/schemas/RecordStatus" }, { type: "null" }] }
    RecipeCreateRequest:
      type: object
      required: [recipe]
      properties:
        recipe: { $ref: "#/components/schemas/RecipeUpsertRequest" }
        ingredients:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/RecipeIngredientRequest" }
        steps:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/RecipeStepRequest" }
    MappedRecipeProduct:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: [number, "null"] }
        layoutCode: { type: [string, "null"] }
        storeId: { type: [string, "null"] }
        storeCode: { type: [string, "null"] }
    IngredientMappingStatus:
      type: object
      properties:
        ingredientId: { type: string, format: uuid }
        ingredientName: { type: string }
        status:
          type: string
          enum: [UNMAPPED, UNAVAILABLE_IN_STORE, MULTIPLE_CANDIDATES, PRODUCT_WITHOUT_LAYOUT, MAPPED]
        product: { oneOf: [{ $ref: "#/components/schemas/MappedRecipeProduct" }, { type: "null" }] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/MappedRecipeProduct" }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        manuallyConfirmed: { type: boolean }
        reason: { type: [string, "null"] }
    RecipeProductMappingResponse:
      type: object
      properties:
        recipeId: { type: string, format: uuid }
        storeId: { type: [string, "null"], format: uuid }
        storeCode: { type: [string, "null"] }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/IngredientMappingStatus" }
    ProductMappingRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }
        productName: { type: [string, "null"], description: Ignored by the backend. }
        layoutCode: { type: [string, "null"], description: Ignored by the backend. }
        storeId: { type: [string, "null"], format: uuid }
        storeCode: { type: [string, "null"], maxLength: 50 }
        mappingType: { type: [string, "null"], enum: [EXACT, CATEGORY, SYNONYM, MANUAL, null] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        manuallyConfirmed: { type: [boolean, "null"] }

    # ---------- upsell
    UpsellSource:
      type: string
      enum: [openai, fallback, filtered, none, cache, disabled]
    UpsellProductSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: [number, "null"] }
        layoutCode: { type: [string, "null"] }
        storeId: { type: [string, "null"] }
        storeCode: { type: [string, "null"] }
        brand: { type: [string, "null"] }
        category: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        hasLayoutPosition: { type: boolean }
    UpsellSuggestion:
      type: object
      properties:
        product: { $ref: "#/components/schemas/UpsellProductSummary" }
        reason: { type: string, maxLength: 180 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    UpsellSuggestionRequest:
      type: object
      required: [checkedProductId]
      properties:
        storeId: { type: [string, "null"], format: uuid }
        storeCode: { type: [string, "null"], maxLength: 50 }
        checkedProductId: { type: integer }
        shoppingListId: { type: [string, "null"], maxLength: 80 }
        currentListProductIds: { type: [array, "null"], items: { type: integer } }
        completedProductIds: { type: [array, "null"], items: { type: integer } }
        source: { type: [string, "null"], maxLength: 50 }
        recipeId: { type: [string, "null"], format: uuid }
    UpsellSuggestionResponse:
      type: object
      properties:
        checkedProductId: { type: integer }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/UpsellSuggestion" }
        source: { $ref: "#/components/schemas/UpsellSource" }
        expiresAt: { type: string, format: date-time }
    UpsellOpportunityRequest:
      type: object
      required: [opportunityId]
      description: Nested constraints are declared but not enforced because the list lacks `@Valid` (finding SEC-12).
      properties:
        opportunityId: { type: string, maxLength: 100 }
        triggerProductIds:
          type: [array, "null"]
          maxItems: 20
          items: { type: integer }
        triggerProductNames:
          type: [array, "null"]
          maxItems: 20
          items: { type: string, maxLength: 120 }
    UpsellPlanRequest:
      type: object
      required: [opportunities]
      properties:
        storeId: { type: [string, "null"], format: uuid }
        storeCode: { type: [string, "null"], maxLength: 50 }
        shoppingListId: { type: [string, "null"], maxLength: 80 }
        currentListProductIds: { type: [array, "null"], items: { type: integer } }
        completedProductIds: { type: [array, "null"], items: { type: integer } }
        source: { type: [string, "null"], maxLength: 50 }
        opportunities:
          type: array
          minItems: 1
          maxItems: 80
          items: { $ref: "#/components/schemas/UpsellOpportunityRequest" }
    UpsellOpportunityResponse:
      type: object
      properties:
        opportunityId: { type: string }
        triggerProductIds: { type: array, items: { type: integer } }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/UpsellSuggestion" }
    UpsellPlanDebug:
      type: object
      description: Diagnostic data exposed to anonymous clients (finding SEC-21).
      properties:
        requestId: { type: string }
        model: { type: [string, "null"] }
        responseSource: { type: string }
        elapsedMs: { type: [integer, "null"] }
        openAiElapsedMs: { type: [integer, "null"] }
        inputTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        totalTokens: { type: [integer, "null"] }
        cachedInputTokens: { type: [integer, "null"] }
        reasoningTokens: { type: [integer, "null"] }
        fallbackReason: { type: [string, "null"] }
        opportunityCount: { type: [integer, "null"] }
        candidateCount: { type: [integer, "null"] }
    UpsellPlanResponse:
      type: object
      properties:
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/UpsellOpportunityResponse" }
        source: { $ref: "#/components/schemas/UpsellSource" }
        expiresAt: { type: string, format: date-time }
        debug: { oneOf: [{ $ref: "#/components/schemas/UpsellPlanDebug" }, { type: "null" }] }
    UpsellEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType: { type: string, maxLength: 40, description: Stored upper-case. }
        checkedProductId: { type: [integer, "null"] }
        suggestedProductId: { type: [integer, "null"] }
        storeId: { type: [string, "null"], format: uuid }
        storeCode: { type: [string, "null"], maxLength: 50 }
        sessionId: { type: [string, "null"], maxLength: 120, description: Stored as SHA-256 hash. }
        source: { type: [string, "null"], maxLength: 40 }
        metadataJson: { type: [string, "null"], maxLength: 4000 }
    UpsellDismissRequest:
      type: object
      required: [checkedProductId]
      properties:
        checkedProductId: { type: integer }
        suggestedProductId: { type: [integer, "null"] }
        storeId: { type: [string, "null"], format: uuid }
        storeCode: { type: [string, "null"], maxLength: 50 }
        sessionId: { type: [string, "null"], maxLength: 120 }
        suppressMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 30
          description: Default 240 when null. The iOS client sends 1440, which is rejected (finding API-01).

    # ---------- admin session & logs
    CurrentUserResponse:
      type: object
      properties:
        subject: { type: string }
        username: { type: string }
        email: { type: [string, "null"] }
        role: { type: string, enum: [admin, region-manager, store-manager] }
        scope:
          type: object
          properties:
            regionId: { type: [string, "null"], format: uuid }
            regionName: { type: [string, "null"] }
            storeId: { type: [string, "null"], format: uuid }
            storeName: { type: [string, "null"] }
    SystemLogResponse:
      type: object
      properties:
        limit: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              entityType: { type: string }
              entityId: { type: string, format: uuid }
              action: { type: string }
              summary: { type: [string, "null"] }
              actorRole: { type: [string, "null"] }
              actorLabel: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
    ErrorLogResponse:
      type: object
      properties:
        limit: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              statusCode: { type: integer }
              method: { type: [string, "null"] }
              path: { type: string }
              message: { type: [string, "null"] }
              errorType: { type: [string, "null"] }
              stackTrace: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }

    # ---------- regions & stores
    RegionUpsertRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
    RegionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RecordStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StoreUpsertRequest:
      type: object
      required: [regionId, storeCode, name, street, zipCode, city, country]
      properties:
        regionId: { type: string, format: uuid }
        storeCode: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 150 }
        street: { type: string, maxLength: 150 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        notes: { type: [string, "null"], maxLength: 2000 }
    StoreRegionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    StoreSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeCode: { type: string }
        name: { type: string }
        city: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        status: { $ref: "#/components/schemas/RecordStatus" }
        region: { $ref: "#/components/schemas/StoreRegionSummary" }
        activeBeaconCount: { type: integer }
        hasActiveLayout: { type: boolean }
    StoreSummaryPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/StoreSummaryResponse" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
    StoreDetailResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeCode: { type: string }
        name: { type: string }
        street: { type: string }
        zipCode: { type: string }
        city: { type: string }
        country: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RecordStatus" }
        archivedAt: { type: [string, "null"], format: date-time }
        region: { $ref: "#/components/schemas/StoreRegionSummary" }
        activeLayout:
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: { type: string, format: uuid }
                versionNo: { type: integer }
                createdAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StoreAuditResponse:
      type: object
      properties:
        storeId: { type: string, format: uuid }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              entityType: { type: string }
              action: { type: string }
              summary: { type: [string, "null"] }
              actorRole: { type: [string, "null"] }
              actorLabel: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }

    # ---------- store layouts
    LayoutSaveRequest:
      type: object
      required: [layout]
      properties:
        layoutName: { type: [string, "null"], maxLength: 150 }
        changeNote: { type: [string, "null"], maxLength: 2000 }
        activate: { type: [boolean, "null"] }
        layout: { $ref: "#/components/schemas/LayoutDocument" }
    StoreLayoutResponse:
      type: object
      properties:
        layoutId: { type: [string, "null"], format: uuid }
        storeId: { type: string, format: uuid }
        versionNo: { type: [integer, "null"] }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED, DEFAULT] }
        createdAt: { type: [string, "null"], format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        layout: { $ref: "#/components/schemas/LayoutDocument" }
    LayoutVersionSummary:
      type: object
      properties:
        layoutId: { type: string, format: uuid }
        versionNo: { type: integer }
        layoutName: { type: [string, "null"] }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
    EditorContextResponse:
      type: object
      properties:
        store:
          type: object
          properties:
            id: { type: string, format: uuid }
            storeCode: { type: string }
            name: { type: string }
        currentLayout: { $ref: "#/components/schemas/StoreLayoutResponse" }
        assignedBeacons:
          type: array
          items:
            type: object
            properties:
              beaconId: { type: string, format: uuid }
              beaconCode: { type: string }
              identityKey: { type: string }
              uuid: { type: string }
              major: { type: [integer, "null"] }
              minor: { type: [integer, "null"] }

    # ---------- beacons
    BeaconCreateRequest:
      type: object
      required: [beaconCode, uuid]
      properties:
        beaconCode: { type: string, maxLength: 60 }
        uuid: { type: string, maxLength: 40, description: 32 hex characters, hyphens allowed. }
        major: { type: [integer, "null"], description: Required together with minor. No 0..65535 range check yet (finding BUG-08). }
        minor: { type: [integer, "null"], description: Required together with major. }
        notes: { type: [string, "null"], maxLength: 2000 }
    BeaconBulkCreateRequest:
      type: object
      required: [uuid, items]
      properties:
        uuid: { type: string, maxLength: 40 }
        major: { type: [integer, "null"] }
        notes: { type: [string, "null"], maxLength: 2000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [beaconCode]
            properties:
              beaconCode: { type: string, maxLength: 60 }
              minor: { type: [integer, "null"] }
    BeaconStoreSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
