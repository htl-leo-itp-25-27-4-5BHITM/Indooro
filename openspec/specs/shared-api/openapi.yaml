        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayoutSaveRequest" }
      responses:
        "200": { $ref: "#/components/responses/StoreLayoutOk" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stores/{storeId}/layout/versions/{layoutId}:
    get:
      tags: [store-layouts]
      operationId: getStoreLayoutVersion
      summary: One layout version of the store.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/LayoutIdPath"
      responses:
        "200": { $ref: "#/components/responses/StoreLayoutOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stores/{storeId}/layout/versions/{layoutId}/activate:
    post:
      tags: [store-layouts]
