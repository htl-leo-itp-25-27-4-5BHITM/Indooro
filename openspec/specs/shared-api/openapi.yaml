      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      x-indooro-findings: [BUG-03]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/LayoutIdPath"
      responses:
        "200": { $ref: "#/components/responses/StoreLayoutOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stores/{storeId}/layout/editor-context:
    get:
      tags: [store-layouts]
      operationId: getStoreEditorContext
      summary: Store reference, current layout, and assigned beacons for the editor.
      security: [{ oidcSession: [] }, { bearerAuth: [] }]
      x-indooro-access: role:admin|region-manager|store-manager
      x-indooro-consumers: [admin-ui]
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: Editor context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorContextResponse" }
