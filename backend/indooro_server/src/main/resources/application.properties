# OpenSearch Configuration
opensearch.host=localhost
%prod.opensearch.host=opensearch
opensearch.port=9200
opensearch.index=${OPENSEARCH_INDEX:products}
# Index-Versionen fuer Reindex/Umschaltung: Indizes products_v1, products_v2, ... hinter dem Alias products_live
opensearch.index-prefix=products_v
opensearch.alias=${OPENSEARCH_ALIAS:products_live}
opensearch.layout-index=layouts
opensearch.category-index=categories
# Store for catalog reads without storeId/storeCode (empty = no default filter, old behavior)
indooro.catalog.default-store-code=${CATALOG_DEFAULT_STORE_CODE:}

# Upsell/OpenAI Configuration
upsell.enabled=${UPSELL_ENABLED:true}
upsell.max-candidates=${UPSELL_MAX_CANDIDATES:150}
upsell.max-suggestions=${UPSELL_MAX_SUGGESTIONS:3}
upsell.min-confidence=${UPSELL_MIN_CONFIDENCE:0.45}
upsell.cache-ttl-minutes=${UPSELL_CACHE_TTL_MINUTES:60}
openai.api-key=${OPENAI_API_KEY:}
openai.upsell.enabled=${OPENAI_UPSELL_ENABLED:false}
openai.upsell.model=${OPENAI_UPSELL_MODEL:gpt-5.4-mini}
openai.upsell.reasoning-effort=${OPENAI_UPSELL_REASONING_EFFORT:none}
openai.upsell.timeout-ms=${OPENAI_UPSELL_TIMEOUT_MS:12000}

# PostgreSQL configuration for admin platform data
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:indooro}
quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.password=${DB_PASSWORD:change-me-db-password}
%test.quarkus.datasource.password=test-only-not-a-secret
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:indooro}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:indooro}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
# A 10 MiB underlay becomes about 13.4 MiB when Base64-encoded in JSON.
quarkus.http.limits.max-body-size=14M

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://it220209.cloud.htl-leonding.ac.at,https://www.indooro.at,https://indooro.at}
%dev.quarkus.http.cors.origins=http://localhost:8080,http://localhost:5173
%test.quarkus.http.cors.origins=http://localhost:8080,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=same-origin
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000

# Keycloak / OIDC configuration for the Admin Platform
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/indooro}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:indooro-admin-web}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%dev.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:change-me-admin-web-client-secret}
%test.quarkus.oidc.credentials.secret=test-only-not-a-secret
quarkus.oidc.application-type=hybrid
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.token-state-manager.strategy=keep-all-tokens
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.logout.path=/admin/logout
quarkus.oidc.logout.post-logout-path=/

quarkus.http.auth.permission.public-static.paths=/,/index.html,/assets/*,/media/*,/logos/*,/api/mobile/*
quarkus.http.auth.permission.public-static.policy=permit
quarkus.http.auth.permission.public-read.paths=/api/products,/api/products/*,/api/layout,/api/layout/*
quarkus.http.auth.permission.public-read.methods=GET,HEAD
quarkus.http.auth.permission.public-read.policy=permit
quarkus.http.auth.permission.category-read.paths=/api/categories,/api/categories/*
quarkus.http.auth.permission.category-read.methods=GET,HEAD
quarkus.http.auth.permission.category-read.policy=permit
quarkus.http.auth.permission.admin-write.paths=/api/products,/api/products/*,/api/categories,/api/categories/*,/api/layout,/api/layout/*,/api/convert/*,/api/export/*
quarkus.http.auth.permission.admin-write.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.admin-write.policy=authenticated
quarkus.http.auth.permission.admin.paths=/admin,/admin/*,/api/admin/*,/api/regions,/api/regions/*,/api/stores,/api/stores/*,/api/beacons,/api/beacons/*,/api/categories,/api/categories/*
quarkus.http.auth.permission.admin.policy=authenticated

%prod.quarkus.security.jaxrs.deny-unannotated-endpoints=true

%test.quarkus.oidc.enabled=false
%test.quarkus.http.auth.permission.admin.policy=permit
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report-location=target/site/jacoco
%test.quarkus.jacoco.excludes=at/htl/DTO/**,at/htl/admin/dto/**,at/htl/admin/entity/**,at/htl/config/**,at/htl/model/**

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.indoor.navigation".level=DEBUG

quarkus.package.type=uber-jar
