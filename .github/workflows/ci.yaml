name: Build and Push Backend

on:
  push:
    branches: [ "main", "master" ] # Führt den Build aus, wenn du auf main/master pushst
    paths:
      - 'backend/indooro_server/**' # Nur wenn sich was im Backend ändert
      - 'admin-ui/**' # Neues Admin-Frontend wird ins Backend-Image gepackt
      - 'openspec/**'
      - 'api/**'
      - 'api-tests/**'
      - 'scripts/contract/**'
      - 'redocly.yaml'
      - 'package.json'
      - '.github/workflows/ci.yaml'
  pull_request: # Contract-Job läuft auf jedem PR, auch bei reinen Doku-PRs: deshalb kein paths-Filter
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend-v2

jobs:
  # Vertrag (openspec/specs/shared-api/openapi.yaml) gegen Lint, generierte Dateien,
  # Mobile-Export, Parität mit dem Quarkus-Export und (nur PR) Breaking-Change-Check.
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history for the oasdiff base revision)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (version from admin-ui/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install root dependencies (contract tooling)
        run: npm ci --no-audit --no-fund

      - name: Install admin UI dependencies (generated types are checked against them)
        working-directory: admin-ui
        run: npm ci --no-audit --no-fund

      - name: Lint reviewed contract
        run: npm run contract:lint

      - name: Contract tests (node --test)
        run: npm run contract:test

      - name: Generated TypeScript types are up to date
        run: npm run contract:types:check

      - name: Mobile OpenAPI export is up to date
        run: npm run contract:mobile:check

      - name: Generated Quarkus OpenAPI matches the reviewed contract
        run: npm run contract:parity

      # oasdiff runs as a pinned container (v1.33.0). The base spec is exported to a file first,
      # because the container cannot read git revisions of the workspace ("dubious ownership").
      # Reviewed, intentional breaking findings are listed in api/openapi/oasdiff-accepted-breaking.txt.
      - name: Breaking-change check against the target branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .oasdiff
          git show "origin/${{ github.base_ref }}:openspec/specs/shared-api/openapi.yaml" > .oasdiff/base-openapi.yaml
          docker run --rm -v "$PWD":/w -w /w \
            tufin/oasdiff@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c \
            breaking .oasdiff/base-openapi.yaml openspec/specs/shared-api/openapi.yaml \
            --fail-on ERR \
            --err-ignore api/openapi/oasdiff-accepted-breaking.txt \
            --format githubactions

      - name: Validate OpenSpec change and specs (strict)
        run: npx -y @fission-ai/openspec@1.3.1 validate --all --strict

  # Backend-Tests ohne -DskipTests. Dieselben Tests laufen vor dem Image-Build, nicht doppelt.
  backend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js for admin UI
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Test and build admin UI into backend resources (/admin/next/)
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package:candidate
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/admin/next/index.html

      - name: Test with Maven (tests must pass; no -DskipTests)
        working-directory: backend/indooro_server
        run: mvn -B verify

      - name: Test ops scripts
        run: python3 -I -m unittest discover scripts/ops

  build-and-push:
    needs: [contract, backend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js for admin UI
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      # Die Admin-UI-Tests laufen in backend-test. Hier wird nur das Bundle gebaut, das ins Jar gehört.
      - name: Build admin UI into backend resources (/admin/next/)
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run package:candidate
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/admin/next/index.html

      # -DskipTests ist hier bewusst: backend-test hat mvn verify auf demselben Commit bereits ausgeführt
      # (needs: backend-test). Dieser Schritt erzeugt nur das *-runner.jar, das die Dockerfile kopiert.
      - name: Package runner jar for the image (tests already ran in backend-test)
        working-directory: backend/indooro_server
        run: mvn -B package -DskipTests

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/indooro_server
          file: backend/indooro_server/src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
