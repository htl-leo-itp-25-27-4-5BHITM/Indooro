name: Build and Push Backend

on:
  push:
    branches: [ "main", "master" ] # Führt den Build aus, wenn du auf main/master pushst
    paths:
      - 'backend/indooro_server/**' # Nur wenn sich was im Backend ändert
      - 'admin-ui/**' # Neues Admin-Frontend wird ins Backend-Image gepackt
      - 'pilot-showcase/**' # Pilot-Demo wird unter /showcase/ ins Backend-Image gepackt
      - 'openspec/**'
      - 'api/**'
      - 'api-tests/**'
      - 'scripts/contract/**'
      - 'redocly.yaml'
      - 'package.json'
      - '.github/workflows/ci.yaml'
  pull_request: # Contract-Job läuft auf jedem PR, auch bei reinen Doku-PRs: deshalb kein paths-Filter
    branches: [ "main", "master" ]
    # ready_for_review: ein Draft-PR, der fertig wird, bekommt sofort die schweren Jobs.
    types: [ opened, synchronize, reopened, ready_for_review ]

# PR: ein neuer Push bricht den alten Lauf desselben PRs ab (spart Minuten).
# Push nach main/master: Gruppe pro Commit, nichts wird abgebrochen, jeder Merge bekommt sein Image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend-v2

jobs:
  # Vertrag (openspec/specs/shared-api/openapi.yaml) gegen Lint, generierte Dateien,
  # Mobile-Export, Parität mit dem Quarkus-Export und (nur PR) Breaking-Change-Check.
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history for the oasdiff base revision)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (version from admin-ui/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install root dependencies (contract tooling)
        run: npm ci --no-audit --no-fund

      - name: Install admin UI dependencies (generated types are checked against them)
        working-directory: admin-ui
        run: npm ci --no-audit --no-fund

      - name: Lint reviewed contract
        run: npm run contract:lint

      - name: Contract tests (node --test)
        run: npm run contract:test

      - name: Generated TypeScript types are up to date
        run: npm run contract:types:check

      - name: Mobile OpenAPI export is up to date
        run: npm run contract:mobile:check

      - name: Generated Quarkus OpenAPI matches the reviewed contract
        run: npm run contract:parity

      # oasdiff runs as a pinned container (v1.33.0). The base spec is exported to a file first,
      # because the container cannot read git revisions of the workspace ("dubious ownership").
      # Reviewed, intentional breaking findings are listed in api/openapi/oasdiff-accepted-breaking.txt.
      - name: Breaking-change check against the target branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .oasdiff
          git show "origin/${{ github.base_ref }}:openspec/specs/shared-api/openapi.yaml" > .oasdiff/base-openapi.yaml
          docker run --rm -v "$PWD":/w -w /w \
            tufin/oasdiff@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c \
            breaking .oasdiff/base-openapi.yaml openspec/specs/shared-api/openapi.yaml \
            --fail-on ERR \
            --err-ignore api/openapi/oasdiff-accepted-breaking.txt \
            --format githubactions

      - name: Validate OpenSpec change and specs (strict)
        run: npx -y @fission-ai/openspec@1.3.1 validate --all --strict

  # Backend-Tests ohne -DskipTests. Dieselben Tests laufen vor dem Image-Build, nicht doppelt.
  backend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Echter OpenSearch für StoreIsolationOpenSearchIntegrationTest (Marktisolation mit Repo-Mapping).
    # Der Test schlägt in der CI fehl, wenn der Dienst nicht erreichbar ist (kein stilles Überspringen).
    services:
      opensearch:
        image: opensearchproject/opensearch:2.9.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js for admin UI
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            admin-ui/package-lock.json
            pilot-showcase/package-lock.json

      - name: Test and build admin UI into backend resources (/admin/next/)
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package:candidate
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/admin/next/index.html

      - name: Test and build pilot showcase into backend resources (/showcase/)
        working-directory: pilot-showcase
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package:backend
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/showcase/index.html

      - name: Test with Maven (tests must pass; no -DskipTests)
        working-directory: backend/indooro_server
        env:
          STORE_ISOLATION_OPENSEARCH_PORT: "9200"
        run: mvn -B verify

      - name: Test ops scripts
        run: python3 -I -m unittest discover scripts/ops

  # Playwright suite in a real Chromium: guards the layout and interaction guarantees of the admin UI.
  admin-ui-browser:
    # Pinned: Playwright 1.60 (admin-ui) cannot install Chromium on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (version from admin-ui/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'admin-ui/package-lock.json'

      - name: Install admin UI dependencies
        working-directory: admin-ui
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: admin-ui
        run: npx playwright install --with-deps chromium

      - name: Lint
        working-directory: admin-ui
        run: npm run lint

      - name: Typecheck
        working-directory: admin-ui
        run: npm run typecheck

      - name: Browser tests (pretest builds and verifies the bundle)
        working-directory: admin-ui
        run: npm run test:browser -- --reporter=list,html --trace=retain-on-failure

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-playwright
          path: |
            admin-ui/playwright-report/
            admin-ui/test-results/
          if-no-files-found: ignore

  # pilot-showcase has no lint script: the typecheck runs as part of npm run build.
  pilot-showcase-browser:
    # Pinned like admin-ui-browser: same Chromium and font base for both suites.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (version from pilot-showcase/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: 'pilot-showcase/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'pilot-showcase/package-lock.json'

      - name: Install showcase dependencies
        working-directory: pilot-showcase
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: pilot-showcase
        run: npx playwright install --with-deps chromium

      - name: Typecheck and build
        working-directory: pilot-showcase
        run: npm run build

      - name: Browser tests (desktop and mobile)
        working-directory: pilot-showcase
        run: npm run test:e2e -- --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-showcase-playwright
          path: |
            pilot-showcase/playwright-report/
            pilot-showcase/test-results/
          if-no-files-found: ignore

  build-and-push:
    needs: [contract, backend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js for admin UI
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            admin-ui/package-lock.json
            pilot-showcase/package-lock.json

      # Die Admin-UI-Tests laufen in backend-test. Hier wird nur das Bundle gebaut, das ins Jar gehört.
      - name: Build admin UI into backend resources (/admin/next/)
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run package:candidate
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/admin/next/index.html

      # Die Showcase-Tests laufen in backend-test. Hier wird nur das Bundle gebaut, das ins Jar gehört.
      - name: Build pilot showcase into backend resources (/showcase/)
        working-directory: pilot-showcase
        run: |
          npm ci --no-audit --no-fund
          npm run package:backend
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/showcase/index.html

      # -DskipTests ist hier bewusst: backend-test hat mvn verify auf demselben Commit bereits ausgeführt
      # (needs: backend-test). Dieser Schritt erzeugt nur das *-runner.jar, das die Dockerfile kopiert.
      - name: Package runner jar for the image (tests already ran in backend-test)
        working-directory: backend/indooro_server
        # Maven Central sometimes answers GitHub runners with HTTP 429 (rate limit). Maven caches that as
        # "(absent)" and aborts. So the resolver retries 429/503 with a delay, and the whole run is
        # restarted with -U (ignore the failure cache) up to three times if it still fails.
        run: |
          MVN_OPTS="-B -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000 -Daether.connector.http.retryHandler.serviceUnavailable=429,503"
          for attempt in 1 2 3; do
            if mvn $MVN_OPTS -U package -DskipTests; then exit 0; fi
            echo "::warning::mvn package attempt $attempt failed, retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/indooro_server
          file: backend/indooro_server/src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
