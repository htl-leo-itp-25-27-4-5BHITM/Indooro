name: Build and Push Backend

on:
  push:
    branches: [ "main", "master" ] # Führt den Build aus, wenn du auf main/master pushst
    paths:
      - 'backend/indooro_server/**' # Nur wenn sich was im Backend ändert
      - 'admin-ui/**' # Neues Admin-Frontend wird ins Backend-Image gepackt
      - '.github/workflows/ci.yaml'
  pull_request: # Tests laufen auch auf Pull Requests; Image wird dort nicht gebaut/gepusht
    branches: [ "main", "master" ]
    paths:
      - 'backend/indooro_server/**'
      - 'admin-ui/**'
      - 'scripts/ops/**'
      - '.github/workflows/ci.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend-v2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js for admin UI
        uses: actions/setup-node@v4
        with:
          node-version-file: 'admin-ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Test and build admin UI into backend resources (/admin/next/)
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package:candidate
          test -f ../backend/indooro_server/src/main/resources/META-INF/resources/admin/next/index.html

      - name: Test and build with Maven (tests must pass before the image is built)
        working-directory: backend/indooro_server
        run: mvn -B verify

      - name: Test ops scripts
        run: python3 -I -m unittest discover scripts/ops

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/indooro_server
          file: backend/indooro_server/src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}