openapi: 3.1.0
info:
  title: Indooro API
  version: 2026.10.12
  summary: Shared HTTP contract of the Indooro backend (Quarkus) for the iOS client, the Admin Platform, and the customer web page.
  description: |
    Hand-reviewed contract for the current implementation in
    `backend/indooro_server/src/main/java/at/htl/resource` and its admin resources.
    It is the single source of truth referenced by the OpenSpec capability `shared-api`.

    Every operation carries:
    - `x-indooro-access`: effective access class today
      (`public`, `authenticated`, `role:admin`, `role:admin|region-manager`, `role:admin|region-manager|store-manager`).
      Region and store scope is enforced additionally by `AdminAccessService` for non-admin roles.
    - `x-indooro-consumers`: known shipped consumers (`ios`, `admin-ui`, `customer-web`, `api-tests`, `none`).
    - `x-indooro-findings` (optional): audit finding ids from `docs/audit/CODE_AUDIT.md`.

    Conventions: camelCase JSON, UUID strings for PostgreSQL ids, integer product ids and category codes,
    ISO-8601 UTC instants (fractional seconds possible), beacon UUIDs as 32 lowercase hex characters.
  contact:
    name: Indooro Team (HTL Leonding)
servers:
  - url: https://it220209.cloud.htl-leonding.ac.at
    description: LeoCloud (namespace student-it220209)
  - url: http://localhost:8080
    description: Local Quarkus dev mode
tags:
  - name: mobile-stores
    description: Anonymous store discovery and store layouts for the iOS client.
  - name: mobile-recipes
    description: Anonymous published recipe catalog.
  - name: mobile-upsell
    description: Anonymous upsell planning, telemetry, and dismissals.
  - name: catalog
    description: Product and category catalog (OpenSearch).
  - name: legacy-layout
    description: Global legacy layout documents (OpenSearch index `layouts`).
