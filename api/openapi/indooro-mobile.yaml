  /api/mobile/stores/by-beacon:
    get:
      tags:
        - mobile-stores
      operationId: findMobileStoreByBeacon
      summary: Resolve the active store for a detected beacon.
      description: |
        With major and minor, the exact identity key is tried first. If no active exact match exists,
        resolution falls back to UUID-only matching (finding BUG-09).
      parameters:
        - name: uuid
          in: query
          required: true
          description: Beacon UUID with or without hyphens, any case.
          schema:
            type: string
            maxLength: 40
        - name: major
          in: query
          description: Must be sent together with minor.
          schema:
            type: integer
        - name: minor
          in: query
          description: Must be sent together with major.
          schema:
            type: integer
      responses:
        "200":
          description: Store and matched beacon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreByBeaconResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
