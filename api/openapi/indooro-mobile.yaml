          type: array
          items:
            type: integer
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/UpsellSuggestion"
    UpsellPlanDebug:
      type: object
      description: Diagnostic data exposed to anonymous clients (finding SEC-21).
      properties:
        requestId:
          type: string
        model:
          type:
            - string
            - "null"
        responseSource:
          type: string
        elapsedMs:
          type:
            - integer
            - "null"
        openAiElapsedMs:
          type:
            - integer
            - "null"
        inputTokens:
          type:
            - integer
            - "null"
        outputTokens:
          type:
            - integer
            - "null"
        totalTokens:
          type:
            - integer
            - "null"
        cachedInputTokens:
          type:
            - integer
            - "null"
        reasoningTokens:
          type:
            - integer
            - "null"
        fallbackReason:
          type:
            - string
            - "null"
        opportunityCount:
          type:
            - integer
            - "null"
        candidateCount:
          type:
            - integer
            - "null"
    UpsellPlanResponse:
      type: object
      properties:
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/UpsellOpportunityResponse"
        source:
          $ref: "#/components/schemas/UpsellSource"
        expiresAt:
          type: string
          format: date-time
        debug:
          oneOf:
            - $ref: "#/components/schemas/UpsellPlanDebug"
            - type: "null"
    UpsellEventRequest:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
          maxLength: 40
          description: Stored upper-case.
        checkedProductId:
          type:
            - integer
            - "null"
        suggestedProductId:
          type:
            - integer
            - "null"
        storeId:
          type:
            - string
            - "null"
          format: uuid
        storeCode:
          type:
            - string
            - "null"
          maxLength: 50
        sessionId:
          type:
            - string
            - "null"
          maxLength: 120
          description: Stored as SHA-256 hash.
        source:
          type:
            - string
            - "null"
          maxLength: 40
        metadataJson:
          type:
            - string
            - "null"
          maxLength: 4000
    UpsellDismissRequest:
      type: object
      required:
        - checkedProductId
      properties:
        checkedProductId:
          type: integer
        suggestedProductId:
          type:
            - integer
            - "null"
        storeId:
          type:
            - string
            - "null"
          format: uuid
        storeCode:
          type:
            - string
            - "null"
          maxLength: 50
        sessionId:
          type:
            - string
            - "null"
          maxLength: 120
        suppressMinutes:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 30
          description: Default 240 when null. The iOS client sends 1440, which is rejected (finding API-01).
  responses:
    BadRequest:
      description: Request rejected by service validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ValidationFailed:
      description: Bean Validation or service validation failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - $ref: "#/components/schemas/ViolationReport"
    NotFound:
      description: Entity not found or not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Uniqueness or state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    LegacyBadRequest:
      description: Legacy error body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyNotFound:
      description: Legacy error body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyServerError:
      description: Legacy error body built by string concatenation (may be invalid JSON, finding BUG-12).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
  parameters:
    StoreIdPath:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipeIdPath:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoreIdQuery:
      name: storeId
      in: query
      schema:
        type: string
        format: uuid
    StoreIdTextQuery:
      name: storeId
      in: query
      description: Free-text store id matched against the product `storeId` keyword.
      schema:
        type: string
    StoreCodeQuery:
      name: storeCode
      in: query
      schema:
        type: string
        maxLength: 50
    RecipeTagQuery:
      name: tag
      in: query
      description: Recipe tag code (case-insensitive).
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Zero-based; negative values become 0.
      schema:
        type: integer
        default: 0
        minimum: 0
    MobilePageSize:
      name: size
      in: query
      description: Clamped to 1..50.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
