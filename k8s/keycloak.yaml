# Keycloak im Produktionsmodus (start, PostgreSQL). Kein Secret und keine Klartext-Werte in dieser Datei.
#
# Voraussetzungen (vor dem Apply, im Namespace student-it220209):
# 1. Datenbank `keycloak` und Benutzer anlegen: siehe DEPLOYMENT.md (Abschnitt "Keycloak-Datenbank").
#    Oder Job: k8s/keycloak-db-init-job.yaml.
# 2. Secret `indooro-keycloak-secret` per `kubectl create secret generic` anlegen
#    (Keys: bootstrap-admin-username, bootstrap-admin-password, admin-web-client-secret, db-password).
#    Vorlage: k8s/secrets.example.yaml.
# 3. Realm-ConfigMap aus der Produktions-Realm-Datei erzeugen (Realm-Datei bleibt single-source):
#    kubectl -n student-it220209 create configmap indooro-keycloak-realm \
#      --from-file=indooro-realm.json=k8s/keycloak-realm-prod.json
#    Die ConfigMap ist bewusst NICHT in diesem Manifest enthalten.
#
# Image-Tag: vor dem Apply die neueste 26.x-Patchversion pruefen und den Tag anpassen.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indooro-keycloak
  labels:
    app: indooro-keycloak
spec:
  replicas: 1
  # Ein Datenverzeichnis / eine Datenbank: nie zwei Keycloak-Pods gleichzeitig.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: indooro-keycloak
  template:
    metadata:
      labels:
        app: indooro-keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          # Keycloak 26.0.8. Vor dem Apply neueste 26.x-Patchversion pruefen (Release-Notes auf quay.io/keycloak/keycloak).
          image: quay.io/keycloak/keycloak:26.0.8
          imagePullPolicy: IfNotPresent
          args:
            - "start"
            - "--import-realm"
            - "--http-enabled=true"
            - "--http-port=8080"
            - "--http-relative-path=/keycloak"
            - "--hostname=https://it220209.cloud.htl-leonding.ac.at/keycloak"
            # Admin-Konsole nur per `kubectl port-forward svc/indooro-keycloak 8081:8080` (siehe DEPLOYMENT.md).
            - "--hostname-admin=http://localhost:8081/keycloak"
            - "--proxy-headers=xforwarded"
            - "--health-enabled=true"
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "postgres"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indooro-keycloak-secret
                  key: db-password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: indooro-keycloak-secret
                  key: bootstrap-admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indooro-keycloak-secret
                  key: bootstrap-admin-password
            - name: KC_ADMIN_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: indooro-keycloak-secret
                  key: admin-web-client-secret
          ports:
            - name: http
              containerPort: 8080
            # Health-Endpunkte (Management-Interface). Nur Container-Port, KEIN Service-Port.
            - name: management
              containerPort: 9000
          # Health liegt im Management-Interface auf Port 9000. Falls der Pfad im Cluster
          # nicht antwortet (ohne /keycloak), den Probe-Pfad auf /health/... anpassen.
          startupProbe:
            httpGet:
              path: /keycloak/health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /keycloak/health/live
              port: 9000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /keycloak/health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
      volumes:
        - name: realm-import
          configMap:
            name: indooro-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: indooro-keycloak
  labels:
    app: indooro-keycloak
spec:
  selector:
    app: indooro-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
# Kein eigener Ingress: Routing (nur /keycloak/realms/ und /keycloak/resources/) liegt in k8s/backend-ingress.yaml.
