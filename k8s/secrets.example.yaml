# VORLAGE, NIE mit echten Werten committen.
# Die Secrets werden per `kubectl create secret generic ...` angelegt, siehe
# docs/pilot-readiness/operations/SECRET_ROTATION.md. Diese Datei wird NICHT per
# `kubectl apply` verwendet. Die Platzhalter <REPLACE_ME> nur als Referenz nutzen.
apiVersion: v1
kind: Secret
metadata:
  name: indooro-postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_ME>"
---
apiVersion: v1
kind: Secret
metadata:
  name: indooro-keycloak-secret
type: Opaque
stringData:
  bootstrap-admin-username: "<REPLACE_ME>"
  bootstrap-admin-password: "<REPLACE_ME>"
  admin-web-client-secret: "<REPLACE_ME>"
  demo-admin-password: "<REPLACE_ME>"
  demo-region-password: "<REPLACE_ME>"
  demo-store-password: "<REPLACE_ME>"
---
apiVersion: v1
kind: Secret
metadata:
  name: indooro-openai-secret
type: Opaque
stringData:
  OPENAI_API_KEY: "<REPLACE_ME>"
