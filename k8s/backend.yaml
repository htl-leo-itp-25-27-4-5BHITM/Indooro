apiVersion: apps/v1
kind: Deployment
metadata:
  name: indooro-backend
  labels:
    app: indooro-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indooro-backend
  template:
    metadata:
      labels:
        app: indooro-backend
    spec:
      # Falls das GHCR-Repo privat ist, musst du hier ein imagePullSecret eintragen:
      # imagePullSecrets:
      #   - name: ghcr-credentials
      # Pod-weit: Nicht-root (UID 10001 wie im Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: indooro-backend
          # Fester Tag = Git-Commit-SHA der CI, gleich dem Live-Stand (Release 2026-10-18, UID 10001).
          # Rollout/Rollback siehe docs/pilot-readiness/operations/RELEASE_RUNBOOK.md.
          # Nicht auf a47c5e6 zuruecksetzen: Root-Image (JDK 25), startet mit runAsNonRoot nicht.
          image: ghcr.io/htl-leo-itp-25-27-4-5bhitm/indooro-backend-v2:ed845e3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Quarkus SmallRye Health (Abhaengigkeit quarkus-smallrye-health).
          startupProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "indooro"
            - name: DB_USERNAME
              value: "indooro"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indooro-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: OPENSEARCH_PORT
              value: "9200"
            # Alias products_live -> products_v1 seit 2026-10-19 (Reindex mit keyword-Mapping fuer
            # storeCode/storeId). Ohne diesen Wert liest das Backend den alten Index products, dessen
            # storeCode als text gemappt ist; der Marktfilter findet dann nichts.
            - name: OPENSEARCH_INDEX
              value: "products_live"

            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: indooro-openai-secret
                  key: OPENAI_API_KEY
            - name: OPENAI_UPSELL_ENABLED
              value: "true"
            - name: OPENAI_UPSELL_MODEL
              value: "gpt-5.4-mini"
            - name: OPENAI_UPSELL_REASONING_EFFORT
              value: "none"
            - name: OPENAI_UPSELL_TIMEOUT_MS
              value: "12000"
            - name: UPSELL_MAX_CANDIDATES
              value: "150"

            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: "https://it220209.cloud.htl-leonding.ac.at/keycloak/realms/indooro"
            - name: QUARKUS_OIDC_CLIENT_ID
              value: "indooro-admin-web"
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: indooro-keycloak-secret
                  key: admin-web-client-secret
            - name: QUARKUS_OIDC_APPLICATION_TYPE
              value: "hybrid"
            - name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: QUARKUS_OIDC_TOKEN_STATE_MANAGER_STRATEGY
              value: "keep-all-tokens"
            - name: QUARKUS_OIDC_TOKEN_STATE_MANAGER_SPLIT_TOKENS
              value: "true"

          # Container-Haertung: Root-Dateisystem read-only, nur /tmp ist beschreibbar (emptyDir).
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: indooro-backend
  labels:
    app: indooro-backend
spec:
  selector:
    app: indooro-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  # Nur intern; der externe Zugriff laeuft ueber k8s/backend-ingress.yaml.
  type: ClusterIP
