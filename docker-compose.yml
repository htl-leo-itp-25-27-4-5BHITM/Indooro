version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?Siehe .env.example}
      - KC_ADMIN_WEB_CLIENT_SECRET=${KC_ADMIN_WEB_CLIENT_SECRET:?Siehe .env.example}
      - KC_DEMO_ADMIN_PASSWORD=${KC_DEMO_ADMIN_PASSWORD:?Siehe .env.example}
      - KC_DEMO_REGION_PASSWORD=${KC_DEMO_REGION_PASSWORD:?Siehe .env.example}
      - KC_DEMO_STORE_PASSWORD=${KC_DEMO_STORE_PASSWORD:?Siehe .env.example}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

  opensearch:
    image: opensearchproject/opensearch:2.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.9.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - opensearch

volumes:
  opensearch_data:
    driver: local
